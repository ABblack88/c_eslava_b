<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Atención Activa | Centro Eslava</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface-container": "#eceeee",
              "primary-fixed-dim": "#66d5f1",
              "outline": "#6d797d",
              "on-surface": "#191c1d",
              "outline-variant": "#bdc8cd",
              "error": "#ba1a1a",
              "on-surface-variant": "#3d494c",
              "background": "#f8fafa",
              "surface-white": "#FFFFFF",
              "surface": "#f8fafa",
              "primary": "#006578",
              "success": "#34C759",
              "on-primary": "#ffffff"
            }
          }
        }
      }
    </script>
    <style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #f8fafa;
            color: #191c1d;
        }
    </style>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/rbac.js"></script>
</head>
<body class="min-h-screen flex flex-col pb-20">
    <!-- Top App Bar -->
    <header class="bg-surface-white border-b border-surface-container flex justify-between items-center h-14 px-4 sticky top-0 z-40 shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="material-symbols-outlined text-primary text-xl animate-pulse">radio_button_checked</span>
            <span class="font-bold text-primary text-sm">Cita Activa</span>
        </div>
        <button onclick="window.history.back()" class="text-on-surface-variant font-bold text-xs px-3 py-1.5 border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors">
            Volver
        </button>
    </header>

    <main class="flex-1 p-4 space-y-6">
        <!-- Patient Block -->
        <div class="bg-surface-white rounded-2xl p-5 shadow-sm border border-outline-variant/30">
            <div class="flex items-center space-x-3 mb-4">
                <div id="patient-initials" class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold">
                    -
                </div>
                <div>
                    <h4 id="patient-name" class="font-bold text-sm text-on-surface">Cargando...</h4>
                    <p id="appt-treatment" class="text-xs text-primary font-bold">--</p>
                </div>
            </div>
            <div class="text-xs text-outline space-y-1">
                <p id="patient-id">ID: --</p>
                <p id="patient-phone">Contacto: --</p>
            </div>
        </div>

        <!-- Warning Alert -->
        <div class="bg-red-50 border border-red-200 rounded-2xl p-4 flex gap-2">
            <span class="material-symbols-outlined text-error text-[20px]">warning</span>
            <div>
                <h5 class="text-xs font-bold text-error uppercase tracking-wider mb-1">Alergias & Riesgos</h5>
                <p id="patient-allergies" class="text-xs text-red-700 leading-relaxed font-medium">--</p>
            </div>
        </div>

        <!-- Clinical observations entry -->
        <div class="bg-surface-white rounded-2xl p-5 shadow-sm border border-outline-variant/30 space-y-4 hidden" id="plan-dashboard-card">
            <h4 class="text-sm font-semibold text-text-muted mb-1 uppercase tracking-wider border-b border-surface-container pb-2">Plan de Tratamiento</h4>
            <div class="grid grid-cols-1 gap-3">
                <div class="bg-surface-container-low p-4 rounded-xl border-l-4 border-primary">
                    <p class="text-xs text-primary font-bold uppercase mb-1">Objetivo de Hoy (Sesión Actual)</p>
                    <p class="font-body-md text-sm text-on-surface-variant" id="plan-dashboard-actual">--</p>
                </div>
                <div class="bg-surface-container-low p-4 rounded-xl border-l-4 border-secondary">
                    <p class="text-xs text-secondary font-bold uppercase mb-1">Próxima Sesión</p>
                    <p class="font-body-md text-sm text-on-surface-variant" id="plan-dashboard-siguiente">--</p>
                </div>
            </div>
        </div>

        <div class="bg-surface-white rounded-2xl p-5 shadow-sm border border-outline-variant/30 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm text-on-surface">Evolución de la Sesión</h3>
                <span id="save-status" class="text-[10px] text-outline">Autoguardado inactivo</span>
            </div>

            <form id="form-evolucion" class="space-y-4">
                <textarea id="observaciones" required rows="4" class="w-full rounded-xl border border-outline-variant px-3 py-2 text-sm focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all bg-surface-container-lowest" placeholder="Registre la evolución, respuesta al ejercicio y dolor..."></textarea>
                
                <div class="space-y-1 mb-4">
                    <label class="block text-xs font-bold text-on-surface text-primary">Tratamiento Realizado</label>
                    <p class="text-[10px] text-outline mb-1">Seleccione el servicio principal brindado en esta sesión.</p>
                    <select id="tratamientoCobrado" class="w-full rounded-xl border border-outline-variant px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none bg-surface-container-lowest">
                        <option value="">Cargando tratamientos...</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="block text-xs font-bold text-on-surface">Acciones Realizadas (Bullets)</label>
                    <textarea id="inputAccionesEvo" rows="2" placeholder="Ej. Magneto&#10;Masajes" class="w-full rounded-xl border border-outline-variant px-3 py-2 text-sm focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all bg-surface-container-lowest resize-none"></textarea>
                    <div class="mt-2 flex flex-wrap gap-2">
                        <button type="button" onclick="agregarAccionEvo('Magneto')" class="px-2 py-1 bg-surface-container text-on-surface-variant text-[10px] font-bold rounded-full hover:bg-primary/10 hover:text-primary transition-colors">+ Magneto</button>
                        <button type="button" onclick="agregarAccionEvo('Masajes')" class="px-2 py-1 bg-surface-container text-on-surface-variant text-[10px] font-bold rounded-full hover:bg-primary/10 hover:text-primary transition-colors">+ Masajes</button>
                        <button type="button" onclick="agregarAccionEvo('C. Calientes')" class="px-2 py-1 bg-surface-container text-on-surface-variant text-[10px] font-bold rounded-full hover:bg-primary/10 hover:text-primary transition-colors">+ C. Cal</button>
                        <button type="button" onclick="agregarAccionEvo('C. Frías')" class="px-2 py-1 bg-surface-container text-on-surface-variant text-[10px] font-bold rounded-full hover:bg-primary/10 hover:text-primary transition-colors">+ C. Frías</button>
                        <button type="button" onclick="agregarAccionEvo('Electricidad')" class="px-2 py-1 bg-surface-container text-on-surface-variant text-[10px] font-bold rounded-full hover:bg-primary/10 hover:text-primary transition-colors">+ Electri.</button>
                    </div>
                </div>

                <input type="text" id="recomendaciones" class="w-full rounded-xl border border-outline-variant px-3 py-2 text-sm focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all bg-surface-container-lowest" placeholder="Recomendaciones post-sesión (opcional)"/>
                
                <div class="space-y-1 mt-2">
                    <label class="block text-xs font-bold text-on-surface">Plan para la siguiente sesión (Opcional)</label>
                    <input type="text" id="planSiguienteSesion" class="w-full rounded-xl border border-outline-variant px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none transition-all bg-surface-container-lowest" placeholder="ej. Iniciar ejercicios propiocepción..."/>
                </div>
                
                <!-- Image Upload (Camera) -->
                <div class="space-y-2 mt-2">
                    <label class="block text-xs font-bold text-on-surface">Imágenes Clínicas</label>
                    <div class="flex items-center gap-3">
                        <label for="camera-upload" class="flex items-center gap-2 px-4 py-2 bg-secondary-container text-on-secondary-container rounded-xl font-bold text-xs cursor-pointer active:scale-95 transition-transform shadow-sm">
                            <span class="material-symbols-outlined text-[18px]">photo_camera</span>
                            Tomar / Subir Foto
                        </label>
                        <input type="file" id="camera-upload" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)">
                    </div>
                    <div id="image-preview-container" class="flex gap-2 overflow-x-auto py-2 hide-scrollbar">
                        <!-- Previews will appear here -->
                    </div>
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button type="button" id="btn-save-draft" onclick="guardarBorrador()" class="flex-1 py-3 border border-outline text-on-surface-variant font-bold text-xs rounded-xl hover:bg-surface-container-low transition-all">
                        Borrador
                    </button>
                    <button type="button" id="btn-complete" onclick="culminarProcedimiento()" class="flex-1 bg-primary text-on-primary py-3 rounded-xl font-bold text-xs hover:opacity-90 active:scale-95 transition-all shadow-md flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-sm">check_circle</span>
                        Finalizar
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const citaId = urlParams.get('cita_id');
        let currentCita = null;
        let currentPaciente = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if (!citaId) {
                alert("ID de cita inválido.");
                window.history.back();
                return;
            }
            await cargarDatosCita();
        });

        function agregarAccionEvo(accion) {
            const textarea = document.getElementById('inputAccionesEvo');
            const current = textarea.value.trim();
            textarea.value = current ? current + '\n' + accion : accion;
            textarea.focus();
        }

        async function cargarServicios() {
            try {
                const { data: servicios, error } = await supabaseClient
                    .from('servicios')
                    .select('*')
                    .order('nombre', { ascending: true });

                if (error) throw error;

                const select = document.getElementById('tratamientoCobrado');
                select.innerHTML = '';
                
                // Add the current appointment treatment as default if possible, or just options
                if (servicios && servicios.length > 0) {
                    servicios.forEach(srv => {
                        const opt = document.createElement('option');
                        opt.value = srv.nombre;
                        opt.textContent = srv.nombre;
                        if (currentCita && currentCita.tratamiento === srv.nombre) {
                            opt.selected = true;
                        }
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">Sin servicios disponibles</option>';
                }
            } catch (err) {
                console.error("Error cargando servicios:", err);
            }
        }

        async function cargarDatosCita() {
            try {
                const { data: cita, error } = await supabaseClient
                    .from('citas')
                    .select('*, pacientes(*)')
                    .eq('id', citaId)
                    .single();

                if (error) throw error;
                currentCita = cita;
                currentPaciente = cita.pacientes;

                await cargarServicios();

                if (currentPaciente) {
                    document.getElementById('patient-name').textContent = currentPaciente.nombre;
                    document.getElementById('patient-id').textContent = 'ID: #' + currentPaciente.id.substring(0,8).toUpperCase();
                    document.getElementById('patient-phone').textContent = 'Contacto: ' + (currentPaciente.telefono || '--');
                    document.getElementById('patient-initials').textContent = currentPaciente.nombre.charAt(0).toUpperCase();
                    
                    document.getElementById('patient-allergies').textContent = currentPaciente.notas_medicas || 'Sin alertas reportadas.';
                }

                document.getElementById('appt-treatment').textContent = cita.tratamiento || 'Procedimiento General';

                if (cita.notas) {
                    document.getElementById('observaciones').value = cita.notas;
                }

                // Load Treatment Dashboard info
                if (currentPaciente) {
                    const storedTrat = localStorage.getItem(`paciente_tratamiento_${currentPaciente.id}`);
                    if (storedTrat) {
                        const data = JSON.parse(storedTrat);
                        document.getElementById('plan-dashboard-card').classList.remove('hidden');
                        document.getElementById('plan-dashboard-actual').textContent = data.actual || 'Sin definir';
                        document.getElementById('plan-dashboard-siguiente').textContent = data.siguiente || 'Sin definir';
                    }
                }

                if (cita.estado === 'Completado') {
                    const btnComplete = document.getElementById('btn-complete');
                    btnComplete.innerHTML = `<span class="material-symbols-outlined text-sm">edit_document</span> Guardar Edición`;
                    btnComplete.onclick = editarProcedimiento;
                    
                    const btnSaveDraft = document.getElementById('btn-save-draft');
                    btnSaveDraft.style.display = 'none'; // Hide draft button if already completed
                }
            } catch (err) {
                console.error("Error cargando cita móvil:", err);
                alert("Error al obtener información de la cita.");
            }
        }

        async function guardarBorrador() {
            const obs = document.getElementById('observaciones').value;
            const rec = document.getElementById('recomendaciones').value;
            const fullObs = rec ? `${obs}\n\nRecomendaciones: ${rec}` : obs;
            const nuevoTratamiento = document.getElementById('tratamientoCobrado').value;

            const btn = document.getElementById('btn-save-draft');
            btn.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from('citas')
                    .update({ 
                        notas: fullObs,
                        estado: 'En Progreso',
                        tratamiento: nuevoTratamiento
                    })
                    .eq('id', citaId);

                if (error) throw error;

                document.getElementById('save-status').textContent = 'Borrador guardado';
                showToast("Borrador guardado", "success");
            } catch (err) {
                console.error("Error al guardar borrador móvil:", err);
                alert("Error al guardar observaciones.");
            } finally {
                btn.disabled = false;
            }
        }

        async function culminarProcedimiento() {
            const obs = document.getElementById('observaciones').value;
            const rec = document.getElementById('recomendaciones').value;
            const fullObs = rec ? `${obs}\n\nRecomendaciones: ${rec}` : obs;

            if (!obs.trim()) {
                alert("Ingrese observaciones antes de culminar.");
                return;
            }

            const btn = document.getElementById('btn-complete');
            btn.disabled = true;

            try {
                // Prepare notes for the timeline
                const rawAcc = document.getElementById('inputAccionesEvo').value;
                const accList = rawAcc.split('\n').map(x => x.trim()).filter(x => x);

                const now = new Date();
                const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                let bulletsHtml = '';
                if (accList.length > 0) {
                    bulletsHtml = `<div class="mt-4"><p class="text-xs font-bold text-outline uppercase mb-2">Acciones:</p><ul class="space-y-1">` + 
                        accList.map(a => `<li class="text-sm text-on-surface-variant flex items-center gap-2"><span class="material-symbols-outlined text-[14px] text-success">check</span> ${a}</li>`).join('') +
                    `</ul></div>`;
                }

                // Add to LocalStorage timeline history
                if (currentPaciente) {
                    const newEvo = {
                        headerText: `Procedimiento (Atención Virtual): ${currentCita ? currentCita.tratamiento : 'General'}`,
                        timeStr: timeStr,
                        notas: fullObs,
                        bulletsHtml: bulletsHtml,
                        imgHtml: '' // In real app, we'd process the images
                    };

                    let evos = JSON.parse(localStorage.getItem(`paciente_evoluciones_${currentPaciente.id}`) || '[]');
                    evos.unshift(newEvo);
                    localStorage.setItem(`paciente_evoluciones_${currentPaciente.id}`, JSON.stringify(evos));

                    // Shift Treatment Dashboard
                    const planSig = document.getElementById('planSiguienteSesion').value.trim();
                    const storedTrat = localStorage.getItem(`paciente_tratamiento_${currentPaciente.id}`);
                    if (storedTrat) {
                        const tratData = JSON.parse(storedTrat);
                        tratData.anterior = tratData.actual; 
                        if (planSig) {
                            tratData.actual = tratData.siguiente;
                            tratData.siguiente = planSig; 
                        } else {
                            tratData.actual = tratData.siguiente || '';
                            tratData.siguiente = '';
                        }
                        localStorage.setItem(`paciente_tratamiento_${currentPaciente.id}`, JSON.stringify(tratData));
                    }
                }

                const nuevoTratamiento = document.getElementById('tratamientoCobrado').value;

                const { error } = await supabaseClient
                    .from('citas')
                    .update({
                        notas: fullObs,
                        estado: 'Completado',
                        tratamiento: nuevoTratamiento
                    })
                    .eq('id', citaId);

                if (error) throw error;

                showToast("Procedimiento culminado. Redirigiendo...", "success");
                
                setTimeout(() => {
                    const role = new URLSearchParams(window.location.search).get('role') || 'admin';
                    const pacienteIdStr = currentPaciente ? currentPaciente.id : '';
                    window.location.href = `pagos_facturacion_mobile.html?paciente_id=${pacienteIdStr}&cita_id=${citaId}&role=${role}`;
                }, 1500);

            } catch (err) {
                console.error("Error al culminar procedimiento móvil:", err);
                alert("Error al culminar el procedimiento.");
                btn.disabled = false;
            }
        }

        async function editarProcedimiento() {
            const obs = document.getElementById('observaciones').value;
            const rec = document.getElementById('recomendaciones').value;
            const fullObs = rec ? `${obs}\n\nRecomendaciones: ${rec}` : obs;
            const nuevoTratamiento = document.getElementById('tratamientoCobrado').value;

            if (!obs) {
                alert("Ingrese observaciones antes de guardar.");
                return;
            }

            const btn = document.getElementById('btn-complete');
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined text-sm">hourglass_empty</span> Guardando...`;

            try {
                const { error } = await supabaseClient
                    .from('citas')
                    .update({
                        notas: fullObs,
                        tratamiento: nuevoTratamiento
                        // no cambiamos el estado, ya es Completado
                    })
                    .eq('id', citaId);

                if (error) throw error;

                showToast("Procedimiento actualizado correctamente.", "success");
                setTimeout(() => {
                    const role = new URLSearchParams(window.location.search).get('role') || 'admin';
                    window.location.href = `calendario_dashboard_mobile.html?role=${role}`;
                }, 1500);

            } catch (err) {
                console.error("Error actualizando procedimiento:", err);
                alert("Error al actualizar el procedimiento.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span class="material-symbols-outlined text-sm">edit_document</span> Guardar Edición`;
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const container = document.getElementById('image-preview-container');
                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'relative min-w-[80px] w-20 h-20 rounded-xl overflow-hidden border border-outline-variant shadow-sm shrink-0';
                    imgDiv.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-full object-cover">
                        <button type="button" onclick="this.parentElement.remove()" class="absolute top-1 right-1 bg-surface-white/80 text-error rounded-full w-5 h-5 flex items-center justify-center shadow-sm backdrop-blur-sm">
                            <span class="material-symbols-outlined text-[14px]">close</span>
                        </button>
                    `;
                    container.appendChild(imgDiv);
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
