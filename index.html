<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Acceso - Centro Eslava</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #060913;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(13, 20, 38, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .ambient-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }
        
        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
            outline: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.5);
        }
        
        .tab-btn {
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            border-bottom-color: #10b981;
            color: #10b981;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#10b981",
                        secondary: "#06b6d4"
                    }
                }
            }
        }
    </script>

    <script src="js/app.js"></script>
    <script src="js/rbac.js"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="glass-panel w-full max-w-md p-8 rounded-3xl relative z-10 flex flex-col gap-6">
        <!-- Header -->
        <div class="text-center flex flex-col items-center gap-2">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20 mb-2">
                <span class="material-symbols-outlined text-white text-3xl">health_and_safety</span>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Centro Eslava</h1>
            <p class="text-gray-400 text-sm">Portal Clínico Administrativo</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-white/10 mt-4">
            <button onclick="switchTab('login')" id="tab-login" class="tab-btn active flex-1 pb-3 text-sm font-semibold text-primary">Iniciar Sesión</button>
            <button onclick="switchTab('signup')" id="tab-signup" class="tab-btn flex-1 pb-3 text-sm font-semibold text-gray-400 hover:text-gray-300">Registrarse</button>
        </div>

        <!-- Login Form -->
        <form id="form-login" class="flex flex-col gap-4 mt-2" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Usuario / Correo</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xl">person</span>
                    <input type="text" id="login-user" required class="form-input w-full rounded-xl py-3 pl-10 pr-4 text-sm" placeholder="ejemplo@centroeslava.com">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Contraseña</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xl">lock</span>
                    <input type="password" id="login-pass" required class="form-input w-full rounded-xl py-3 pl-10 pr-10 text-sm" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('login-pass', 'login-eye')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors flex items-center">
                        <span id="login-eye" class="material-symbols-outlined text-[18px]">visibility</span>
                    </button>
                </div>
            </div>
            
            <div class="flex justify-end">
                <a href="#" class="text-xs text-primary hover:text-primary/80 transition-colors">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 mt-2">
                Ingresar al Portal
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
            </button>
            
            <!-- Quick Login Shortcuts (For Simulator) -->
            <div class="mt-6 border-t border-white/10 pt-6">
                <p class="text-xs text-center text-gray-500 mb-4 uppercase tracking-wider font-semibold">Acceso Rápido (Simulador)</p>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="quickLogin('root')" class="py-2 px-3 rounded-lg bg-error/10 hover:bg-error/20 border border-error/30 transition-colors text-xs text-left flex items-center gap-2">
                        <span class="material-symbols-outlined text-error text-base">admin_panel_settings</span>
                        <span class="text-error font-bold">ROOT MASTER</span>
                    </button>
                    <button type="button" onclick="quickLogin('admin')" class="py-2 px-3 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition-colors text-xs text-left flex items-center gap-2">
                        <span class="material-symbols-outlined text-secondary text-base">admin_panel_settings</span>
                        <span class="text-gray-300">Administrador</span>
                    </button>
                    <button type="button" onclick="quickLogin('medico')" class="py-2 px-3 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition-colors text-xs text-left flex items-center gap-2">
                        <span class="material-symbols-outlined text-blue-400 text-base">stethoscope</span>
                        <span class="text-gray-300">Médico</span>
                    </button>
                    <button type="button" onclick="quickLogin('asistente')" class="py-2 px-3 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition-colors text-xs text-left flex items-center gap-2">
                        <span class="material-symbols-outlined text-purple-400 text-base">support_agent</span>
                        <span class="text-gray-300">Asistente</span>
                    </button>
                </div>
            </div>
        </form>

        <!-- Signup Form (Hidden by default) -->
        <form id="form-signup" class="flex flex-col gap-4 mt-2 hidden" onsubmit="handleSignup(event)">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Nombre Completo</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xl">badge</span>
                    <input type="text" id="signup-name" required class="form-input w-full rounded-xl py-3 pl-10 pr-4 text-sm" placeholder="Juan Pérez">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Correo Electrónico</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xl">mail</span>
                    <input type="email" id="signup-email" required class="form-input w-full rounded-xl py-3 pl-10 pr-4 text-sm" placeholder="correo@centroeslava.com">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Contraseña</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xl">lock</span>
                    <input type="password" id="signup-pass" required class="form-input w-full rounded-xl py-3 pl-10 pr-10 text-sm" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('signup-pass', 'signup-eye')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors flex items-center">
                        <span id="signup-eye" class="material-symbols-outlined text-[18px]">visibility</span>
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Rol Asignado</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xl">work</span>
                    <select id="signup-role" required class="form-input w-full rounded-xl py-3 pl-10 pr-4 text-sm appearance-none">
                        <option value="asistente">Asistente Clínico</option>
                        <option value="medico">Médico / Especialista</option>
                        <option value="admin">Administrador</option>
                        <option value="developer">Desarrollador</option>
                    </select>
                    <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-xl pointer-events-none">expand_more</span>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 mt-4">
                Crear Cuenta
                <span class="material-symbols-outlined text-xl">person_add</span>
            </button>
        </form>

        <div id="error-message" class="hidden bg-error-container/20 text-red-400 border border-red-500/20 p-3 rounded-xl text-xs text-center mt-2"></div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function switchTab(tab) {
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const errorMsg = document.getElementById('error-message');

            errorMsg.classList.add('hidden');

            if (tab === 'login') {
                loginBtn.classList.add('active', 'text-primary');
                loginBtn.classList.remove('text-gray-400');
                signupBtn.classList.remove('active', 'text-primary');
                signupBtn.classList.add('text-gray-400');
                
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                signupBtn.classList.add('active', 'text-primary');
                signupBtn.classList.remove('text-gray-400');
                loginBtn.classList.remove('active', 'text-primary');
                loginBtn.classList.add('text-gray-400');
                
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('error-message');
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                const role = data.session.user?.user_metadata?.role || 'asistente';
                window.location.href = `html/calendario_dashboard_desktop.html?role=${role}`;
            }
        });

        // Autenticación usando Supabase Auth
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;

            // INTERCEPTOR ROOT MASTER (Bypass Supabase)
            if (email === 'qblackx@gmail.com' && pass === 'Augusto451900') {
                const submitBtn = event.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span> Cargando Root...';
                
                // Redirigir directamente al panel maestro
                setTimeout(() => {
                    window.location.href = 'html/master_root.html?role=root';
                }, 500);
                return;
            }

            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span> Ingresando...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: pass,
                });

                if (error) throw error;
                
                const role = data.user?.user_metadata?.role || 'asistente';
                window.location.href = `html/calendario_dashboard_desktop.html?role=${role}`;
            } catch (error) {
                showError("Credenciales incorrectas o error de red: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Ingresar al Portal <span class="material-symbols-outlined text-xl">arrow_forward</span>';
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-pass').value;
            const role = document.getElementById('signup-role').value;

            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span> Creando...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: pass,
                    options: {
                        data: {
                            full_name: name,
                            role: role
                        }
                    }
                });

                if (error) throw error;

                if (data.user) {
                    window.location.href = `html/calendario_dashboard_desktop.html?role=${role}`;
                }
            } catch(error) {
                showError("Error al crear la cuenta: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Crear Cuenta <span class="material-symbols-outlined text-xl">person_add</span>';
            }
        }

        function quickLogin(role) {
            if (role === 'root') {
                window.location.href = `html/master_root.html?role=root`;
            } else {
                window.location.href = `html/calendario_dashboard_desktop.html?role=${role}`;
            }
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
