<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Acceso - Centro Eslava</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #F8FAFC;
            color: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        h1, h2, h3, .display-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .form-input {
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            color: #0F172A;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        
        .form-input:focus {
            border-color: #0097B2;
            box-shadow: 0 0 0 3px rgba(0, 151, 178, 0.1);
            outline: none;
        }

        .btn-primary {
            background-color: #0097B2;
            color: #FFFFFF;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        
        .btn-primary:hover {
            background-color: #007A90;
        }
        
        .btn-primary:active {
            transform: scale(0.99);
        }

        .tech-border {
            border: 1px solid #E2E8F0;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#0097B2",
                        slate: {
                            50: '#F8FAFC',
                            200: '#E2E8F0',
                            500: '#64748B',
                            900: '#0F172A'
                        }
                    }
                }
            }
        }
    </script>

    <script src="js/app.js"></script>
    <script src="js/rbac.js"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="p-4 sm:p-8">
    
    <div class="w-full max-w-4xl bg-white tech-border shadow-sm flex flex-col md:flex-row overflow-hidden">
        
        <div class="bg-primary p-8 md:p-12 md:w-5/12 flex flex-col justify-between text-white">
            <div>
                <div class="mb-6 bg-white p-2 w-max rounded shadow-sm">
                    <img src="https://static.wixstatic.com/media/2a2885_311f2e0d749d44afb4de94959a6ce964~mv2.png" alt="Centro Eslava Logo" class="h-10 object-contain">
                </div>
                <h1 class="text-3xl md:text-4xl font-bold display-font tracking-tight mb-2">Centro Eslava</h1>
                <p class="text-white/80 font-medium text-sm tracking-wide uppercase">Portal Clínico Administrativo</p>
            </div>
            
            <div class="mt-12 hidden md:block">
                <div class="w-full h-px bg-white/20 mb-4"></div>
                <p class="text-xs text-white/60 font-mono">SYS.VER 2.0.4 // SECURE AUTH</p>
            </div>
        </div>

        <div class="p-8 md:p-12 md:w-7/12 flex flex-col justify-center bg-white relative">
            
            <div class="flex border-b border-slate-200 mb-8">
                <button onclick="switchTab('login')" id="tab-login" class="pb-3 px-1 text-sm font-semibold text-primary border-b-2 border-primary mr-6 transition-colors">Iniciar sesión</button>
                <button onclick="switchTab('signup')" id="tab-signup" class="pb-3 px-1 text-sm font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-900 transition-colors">Registrarse</button>
            </div>

            <form id="form-login" class="flex flex-col gap-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-900 uppercase tracking-wider mb-2">Correo electrónico</label>
                    <input type="text" id="login-user" required class="form-input w-full rounded-none py-2.5 px-3 text-sm" placeholder="ejemplo@centroeslava.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-900 uppercase tracking-wider mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="login-pass" required class="form-input w-full rounded-none py-2.5 pl-3 pr-10 text-sm" placeholder="••••••••">
                        <button type="button" onclick="togglePassword('login-pass', 'login-eye')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors flex items-center">
                            <span id="login-eye" class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                </div>
                
                <div class="flex justify-between items-center mt-1">
                    <a href="#" onclick="handleResetPassword(event)" class="text-xs font-medium text-primary hover:underline">Restablecer contraseña</a>
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-none font-bold text-sm display-font tracking-wide mt-2">
                    Acceder al sistema
                </button>
                
                </form>

            <form id="form-signup" class="flex flex-col gap-5 hidden" onsubmit="handleSignup(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-900 uppercase tracking-wider mb-2">Nombre Completo</label>
                    <input type="text" id="signup-name" required class="form-input w-full rounded-none py-2.5 px-3 text-sm" placeholder="Nombre y Apellidos">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-900 uppercase tracking-wider mb-2">Correo Electrónico</label>
                    <input type="email" id="signup-email" required class="form-input w-full rounded-none py-2.5 px-3 text-sm" placeholder="correo@centroeslava.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-900 uppercase tracking-wider mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="signup-pass" required class="form-input w-full rounded-none py-2.5 pl-3 pr-10 text-sm" placeholder="••••••••">
                        <button type="button" onclick="togglePassword('signup-pass', 'signup-eye')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors flex items-center">
                            <span id="signup-eye" class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-900 uppercase tracking-wider mb-2">Rol Asignado</label>
                    <div class="relative">
                        <select id="signup-role" required class="form-input w-full rounded-none py-2.5 pl-3 pr-8 text-sm appearance-none">
                            <option value="asistente">Asistente Clínico</option>
                            <option value="tratante">Tratante / Especialista</option>
                            <option value="admin">Administrador</option>
                            <option value="developer">Desarrollador</option>
                        </select>
                        <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">expand_more</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary w-full py-3 rounded-none font-bold text-sm display-font tracking-wide mt-2">
                    Crear cuenta
                </button>
            </form>

            <div id="error-message" class="hidden bg-red-50 text-red-600 border border-red-200 p-3 text-xs mt-4"></div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function switchTab(tab) {
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const errorMsg = document.getElementById('error-message');

            errorMsg.classList.add('hidden');

            if (tab === 'login') {
                loginBtn.classList.add('text-primary', 'border-primary');
                loginBtn.classList.remove('text-slate-500', 'border-transparent');
                
                signupBtn.classList.remove('text-primary', 'border-primary');
                signupBtn.classList.add('text-slate-500', 'border-transparent');
                
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                signupBtn.classList.add('text-primary', 'border-primary');
                signupBtn.classList.remove('text-slate-500', 'border-transparent');
                
                loginBtn.classList.remove('text-primary', 'border-primary');
                loginBtn.classList.add('text-slate-500', 'border-transparent');
                
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('error-message');
            errorMsg.className = 'bg-red-50 text-red-600 border border-red-200 p-3 text-xs mt-4';
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            const email = document.getElementById('login-user').value;
            if (!email) {
                showError("Por favor, ingresa tu correo electrónico arriba para restablecer la contraseña.");
                return;
            }
            
            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/html/calendario_dashboard_desktop.html'
                });
                if (error) throw error;
                
                const errorMsg = document.getElementById('error-message');
                errorMsg.className = 'bg-green-50 text-green-700 border border-green-200 p-3 text-xs mt-4';
                errorMsg.textContent = "Se ha enviado un enlace de recuperación a tu correo electrónico.";
                errorMsg.classList.remove('hidden');
            } catch (error) {
                showError("Error al restablecer contraseña: " + error.message);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            if(typeof supabaseClient === 'undefined') return;
            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) {
                const role = data.session.user?.user_metadata?.role || 'asistente';
                window.location.href = `html/calendario_dashboard_desktop.html?role=${role}`;
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;

            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Ingresando...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: pass,
                });

                if (error) throw error;
                
                // Verificar si hay sesión activa (si no la hay, el correo no está verificado)
                if (data.user && !data.session) {
                    throw new Error("Por favor, verifica tu correo electrónico antes de iniciar sesión.");
                }
                
                // Verificar si está aprobado en la tabla profiles
                if (data.user && data.session) {
                    const { data: profile } = await supabaseClient.from('profiles').select('status, role').eq('id', data.user.id).single();
                    
                    let status = profile?.status || data.user.user_metadata?.status;
                    
                    // Auto-aprobar a root si por alguna razón está pendiente
                    if (email === 'qblackx@gmail.com' && status === 'pendiente') {
                        await supabaseClient.from('profiles').update({ status: 'aprobado', role: 'root' }).eq('id', data.user.id);
                        status = 'aprobado';
                    }

                    if (status === 'pendiente') {
                        await supabaseClient.auth.signOut();
                        throw new Error("Tu cuenta está pendiente de aprobación por un administrador.");
                    }
                    
                    const role = profile?.role || data.user.user_metadata?.role || 'asistente';
                    
                    // Forzar guardado manual del token por si acaso
                    localStorage.setItem('c-eslava-auth-token', JSON.stringify(data.session));
                    
                    // Pequeño delay para asegurar que Supabase guarde la sesión en localStorage
                    setTimeout(() => {
                        window.location.href = `html/calendario_dashboard_desktop.html?role=${role}`;
                    }, 500);
                }
            } catch (error) {
                showError("Credenciales incorrectas o error de red: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Acceder al sistema';
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-pass').value;
            const role = document.getElementById('signup-role').value;

            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Creando...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: pass,
                    options: {
                        data: {
                            full_name: name,
                            role: role,
                            status: 'pendiente'
                        }
                    }
                });

                if (error) throw error;

                if (data.user) {
                    // Intentamos actualizar la tabla profiles si existe
                    const initialStatus = email === 'qblackx@gmail.com' ? 'aprobado' : 'pendiente';
                    const initialRole = email === 'qblackx@gmail.com' ? 'root' : role;
                    await supabaseClient.from('profiles').update({ status: initialStatus, role: initialRole }).eq('id', data.user.id);
                    
                    const errorMsg = document.getElementById('error-message');
                    errorMsg.className = 'bg-blue-50 text-blue-700 border border-blue-200 p-3 text-xs mt-4 flex items-start gap-2';
                    if (email === 'qblackx@gmail.com') {
                        errorMsg.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> <span><strong>Cuenta de desarrollador creada.</strong> Por favor, verifica tu correo e inicia sesión.</span>';
                    } else {
                        errorMsg.innerHTML = '<span class="material-symbols-outlined text-[18px]">mark_email_unread</span> <span><strong>¡Casi listo!</strong> Te hemos enviado un correo electrónico de confirmación. Por favor, revisa tu bandeja de entrada y verifica tu cuenta. Luego de eso, el administrador aprobará tu acceso.</span>';
                    }
                    errorMsg.classList.remove('hidden');
                    
                    // Limpiar el formulario
                    document.getElementById('form-signup').reset();
                }
            } catch(error) {
                showError("Error al crear la cuenta: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Crear cuenta';
            }
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
